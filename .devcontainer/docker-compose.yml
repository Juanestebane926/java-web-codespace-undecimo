services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Codespaces clona en /workspaces/<nombre-repo>; el workspace debe coincidir para que .github y Copilot vean la raíz del proyecto.
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: curso_web
      MYSQL_USER: estudiante
      MYSQL_PASSWORD: estudiante
    networks:
      - curso-java-web

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: curso_web
      MYSQL_USER: estudiante
      MYSQL_PASSWORD: estudiante
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - curso-java-web

networks:
  curso-java-web:
    driver: bridge
